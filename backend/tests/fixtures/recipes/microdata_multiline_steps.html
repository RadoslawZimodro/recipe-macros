<html><body>
<div itemscope itemtype="https://schema.org/Recipe">
  <h1 itemprop="name">Cynamonki</h1>
  <ul><li itemprop="recipeIngredient">300 g mąki</li></ul>
  <div itemprop="recipeInstructions" itemscope itemtype="https://schema.org/HowToStep">
    <div>Krok 1: <span itemprop="name">Ciasto</span></div>
    <div itemprop="text">
      <p>1. Wymieszaj mąkę z solą.</p><p>Dodaj drożdże i mleko.</p>
      <div><div><img itemprop="image" src="/img/s1-1080.jpg" srcset="/img/s1-320.jpg 320w"></div></div>
      <p>Wyrabiaj 10 minut.</p>
    </div>
  </div>
  <div itemprop="recipeInstructions" itemscope itemtype="https://schema.org/HowToStep">
    <div>Krok 2: <span itemprop="name">Wyrastanie</span></div>
    <div itemprop="text">
      <p>2. Odstaw ciasto do wyrośnięcia.</p><p>Nakryj ściereczką.</p>
      <img itemprop="image" src="/img/s2-1080.jpg" srcset="/img/s2-320.jpg 320w">
    </div>
  </div>
  <div itemprop="recipeInstructions" itemscope itemtype="https://schema.org/HowToStep">
    <div itemprop="text"><p>3. Piecz dokładnie 20 minut.</p></div>
  </div>
  <div itemprop="recipeInstructions" itemscope itemtype="https://schema.org/HowToStep">
    <div itemprop="text"><p>Podaj gorące cynamonki.</p><img itemprop="image" src="/img/s4-1080.jpg"></div>
  </div>
</div>
</body></html>
