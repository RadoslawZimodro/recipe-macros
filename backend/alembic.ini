[alembic]
script_location = migrations
prepend_sys_path = .
# Revision files are named <rev>_<slug>.py, e.g. 0001_initial.py
file_template = %%(rev)s_%%(slug)s
# sqlalchemy.url is not set here: migrations/env.py reads DATABASE_URL via app.config.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
